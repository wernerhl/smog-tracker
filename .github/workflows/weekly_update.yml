name: Weekly NO₂ Update

on:
  schedule:
    - cron: '0 6 * * 0'   # every Sunday at 06:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write          # commit & push the refreshed CSVs + dashboard JSON

concurrency:
  group: weekly-no2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: extraction/requirements.txt

      - name: Install dependencies
        run: pip install -r extraction/requirements.txt

      - name: Extract TROPOMI (last 14 days)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GEE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GEE_SERVICE_ACCOUNT_EMAIL }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python extraction/extract_tropomi.py

      - name: Compute indicators
        run: python extraction/compute_indicators.py

      - name: Generate dashboard JSON + per-metro pages
        run: python extraction/generate_dashboard_json.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/ docs/metros/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly NO₂ update: $(date -u +%Y-%m-%d)"
            git push
          fi
